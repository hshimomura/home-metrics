name: home-metrics

x-app-image: &app_image home-metrics:local

x-app-env: &app_env
  BLE_DB_DSN: postgres://${POSTGRES_USER:-home_metrics}:${POSTGRES_PASSWORD:-home_metrics}@db:5432/${POSTGRES_DB:-ble_sensors}?sslmode=disable
  TZ: ${TZ:-Asia/Tokyo}

services:
  db:
    image: timescale/timescaledb:latest-pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ble_sensors}
      POSTGRES_USER: ${POSTGRES_USER:-home_metrics}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-home_metrics}
      TZ: ${TZ:-Asia/Tokyo}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ./db/energy_optimization.sql:/docker-entrypoint-initdb.d/20-energy-optimization.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-home_metrics} -d ${POSTGRES_DB:-ble_sensors}"]
      interval: 10s
      timeout: 5s
      retries: 12

  hm-api-server:
    image: *app_image
    build:
      context: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      hm-db-migrate:
        condition: service_completed_successfully
    environment:
      <<: *app_env
      API_ADDR: :8080
      API_TOKEN: ${API_TOKEN:-change-me}
      API_REQUIRE_TOKEN: ${API_REQUIRE_TOKEN:-false}
      API_ALLOWED_ORIGINS: ${API_ALLOWED_ORIGINS:-http://localhost:8080}
      CISCO_SPACES_ALLOW_SECONDARY: ${CISCO_SPACES_ALLOW_SECONDARY:-false}
      COLLECTOR_STATUS_STALE_AFTER: ${COLLECTOR_STATUS_STALE_AFTER:-5m}
    ports:
      - "${API_BIND_ADDR:-0.0.0.0}:${API_PORT:-8080}:8080"
    command: ["hm-api-server"]

  hm-db-migrate:
    image: *app_image
    build:
      context: .
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *app_env
      DB_MIGRATIONS_DIR: ${DB_MIGRATIONS_DIR:-db/migrations}
    command: ["hm-db-migrate"]

  hm-db-maint:
    image: *app_image
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      hm-db-migrate:
        condition: service_completed_successfully
    environment:
      <<: *app_env
      DB_MAINT_REFRESH_LOOKBACK: ${DB_MAINT_REFRESH_LOOKBACK:-336h}
      DB_MAINT_RETAIN_MINUTE: ${DB_MAINT_RETAIN_MINUTE:-336h}
      DB_MAINT_INTERVAL: ${DB_MAINT_INTERVAL:-1h}
    entrypoint: ["/bin/sh", "/usr/local/bin/run-db-maint-loop"]

  hm-cisco-spaces-collector:
    image: *app_image
    restart: unless-stopped
    profiles: ["cisco-spaces"]
    depends_on:
      db:
        condition: service_healthy
      hm-db-migrate:
        condition: service_completed_successfully
    environment:
      <<: *app_env
      BLE_SENSORS_FILE: /etc/home-metrics/sensors.json
      SENSOR_INGEST_SOURCE: ${SENSOR_INGEST_SOURCE:-cisco_spaces}
      CISCO_SPACES_API_KEY: ${CISCO_SPACES_API_KEY:-}
      CISCO_SPACES_FIREHOSE_URL: ${CISCO_SPACES_FIREHOSE_URL:-https://partners.dnaspaces.io/api/partners/v1/firehose/events}
      CISCO_SPACES_RECONNECT_MIN_DELAY: ${CISCO_SPACES_RECONNECT_MIN_DELAY:-1s}
      CISCO_SPACES_RECONNECT_MAX_DELAY: ${CISCO_SPACES_RECONNECT_MAX_DELAY:-60s}
      CISCO_SPACES_STREAM_HEARTBEAT: ${CISCO_SPACES_STREAM_HEARTBEAT:-60s}
      CISCO_SPACES_SAMPLE_WINDOW: ${CISCO_SPACES_SAMPLE_WINDOW:-5}
      CISCO_SPACES_FIELD_FRESHNESS: ${CISCO_SPACES_FIELD_FRESHNESS:-60s}
      CISCO_SPACES_UPLOAD_INTERVAL: ${CISCO_SPACES_UPLOAD_INTERVAL:-60s}
      CISCO_SPACES_BATTERY_MODE: ${CISCO_SPACES_BATTERY_MODE:-all}
      CISCO_SPACES_BATTERY_ALLOWLIST: ${CISCO_SPACES_BATTERY_ALLOWLIST:-}
      CISCO_SPACES_DRY_RUN: ${CISCO_SPACES_DRY_RUN:-false}
      CISCO_SPACES_ALLOW_SECONDARY: ${CISCO_SPACES_ALLOW_SECONDARY:-false}
      CISCO_SPACES_DEBUG: ${CISCO_SPACES_DEBUG:-false}
      CISCO_SPACES_PRUNE_CONFIGURED_BLE_SENSORS: ${CISCO_SPACES_PRUNE_CONFIGURED_BLE_SENSORS:-true}
    volumes:
      - ${SENSORS_FILE:-./examples/sensors.json.example}:/etc/home-metrics/sensors.json:ro
    command: ["hm-cisco-spaces-collector"]

  hm-cisco-iot-orchestrator-collector:
    image: *app_image
    restart: unless-stopped
    profiles: ["cisco-iot"]
    depends_on:
      db:
        condition: service_healthy
      hm-db-migrate:
        condition: service_completed_successfully
    environment:
      <<: *app_env
      BLE_SENSORS_FILE: /etc/home-metrics/sensors.json
      SENSOR_INGEST_SOURCE: ${CISCO_IOT_ORCH_INGEST_SOURCE:-cisco_iot_orchestrator}
      CISCO_IOT_ORCH_API_URL: ${CISCO_IOT_ORCH_API_URL:-https://192.168.67.6:8081}
      CISCO_IOT_ORCH_MQTT_ADDR: ${CISCO_IOT_ORCH_MQTT_ADDR:-192.168.67.6:41883}
      CISCO_IOT_ORCH_ONBOARD_APP_ID: ${CISCO_IOT_ORCH_ONBOARD_APP_ID:-onboard}
      CISCO_IOT_ORCH_ONBOARD_API_KEY: ${CISCO_IOT_ORCH_ONBOARD_API_KEY:-}
      CISCO_IOT_ORCH_CONTROL_APP_ID: ${CISCO_IOT_ORCH_CONTROL_APP_ID:-control}
      CISCO_IOT_ORCH_CONTROL_API_KEY: ${CISCO_IOT_ORCH_CONTROL_API_KEY:-}
      CISCO_IOT_ORCH_DATA_APP_ID: ${CISCO_IOT_ORCH_DATA_APP_ID:-data}
      CISCO_IOT_ORCH_DATA_API_KEY: ${CISCO_IOT_ORCH_DATA_API_KEY:-}
      CISCO_IOT_ORCH_TOPIC: ${CISCO_IOT_ORCH_TOPIC:-ioslab/home-metrics/ble/advertisements/v1}
      CISCO_IOT_ORCH_REGISTER_DATA_APP: ${CISCO_IOT_ORCH_REGISTER_DATA_APP:-false}
      CISCO_IOT_ORCH_DRY_RUN: ${CISCO_IOT_ORCH_DRY_RUN:-false}
      CISCO_IOT_ORCH_DEBUG: ${CISCO_IOT_ORCH_DEBUG:-false}
      CISCO_IOT_ORCH_STREAM_HEARTBEAT: ${CISCO_IOT_ORCH_STREAM_HEARTBEAT:-60s}
    volumes:
      - ${SENSORS_FILE:-./examples/sensors.json.example}:/etc/home-metrics/sensors.json:ro
    command: ["hm-cisco-iot-orchestrator-collector"]

  hm-nature-remo-collector:
    image: *app_image
    restart: unless-stopped
    profiles: ["nature-remo"]
    depends_on:
      db:
        condition: service_healthy
      hm-db-migrate:
        condition: service_completed_successfully
    environment:
      <<: *app_env
      NATURE_REMO_TOKEN: ${NATURE_REMO_TOKEN:-}
      NATURE_REMO_INTERVAL: ${NATURE_REMO_INTERVAL:-60s}
      NATURE_REMO_DEVICE_KEY: ${NATURE_REMO_DEVICE_KEY:-remo-e}
      NATURE_REMO_LABEL: ${NATURE_REMO_LABEL:-Nature Remo E}
      NATURE_REMO_LOCATION: ${NATURE_REMO_LOCATION:-}
    command: ["hm-nature-remo-collector"]

  hm-apcupsd-collector:
    image: *app_image
    restart: unless-stopped
    profiles: ["apcupsd"]
    depends_on:
      db:
        condition: service_healthy
      hm-db-migrate:
        condition: service_completed_successfully
    environment:
      <<: *app_env
      APCUPSD_SERVER: ${APCUPSD_SERVER:-tcp://host.docker.internal:3551}
      APCUPSD_INTERVAL: ${APCUPSD_INTERVAL:-60s}
      APCUPSD_TIMEOUT: ${APCUPSD_TIMEOUT:-5s}
      APCUPSD_DEVICE_KEY: ${APCUPSD_DEVICE_KEY:-ups}
      APCUPSD_LABEL: ${APCUPSD_LABEL:-APC UPS}
      APCUPSD_LOCATION: ${APCUPSD_LOCATION:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["hm-apcupsd-collector"]

  hm-echonet-collector:
    image: *app_image
    restart: unless-stopped
    profiles: ["echonet"]
    depends_on:
      db:
        condition: service_healthy
      hm-db-migrate:
        condition: service_completed_successfully
    environment:
      <<: *app_env
      ECHONET_TARGET_IP: ${ECHONET_TARGET_IP:-}
      ECHONET_DEVICE_KEY: ${ECHONET_DEVICE_KEY:-echonet-device}
      ECHONET_LABEL: ${ECHONET_LABEL:-ECHONET Lite device}
      ECHONET_LOCATION: ${ECHONET_LOCATION:-}
      ECHONET_LOCAL_ADDR: ${ECHONET_LOCAL_ADDR:-:3610}
      ECHONET_MULTICAST_ADDR: ${ECHONET_MULTICAST_ADDR:-224.0.23.0:3610}
      ECHONET_POLL_INTERVAL: ${ECHONET_POLL_INTERVAL:-60s}
      ECHONET_REQUEST_TIMEOUT: ${ECHONET_REQUEST_TIMEOUT:-3s}
    command: ["hm-echonet-collector"]

  hm-ble-collector:
    image: *app_image
    restart: unless-stopped
    profiles: ["ble"]
    user: root
    depends_on:
      db:
        condition: service_healthy
      hm-db-migrate:
        condition: service_completed_successfully
    environment:
      <<: *app_env
      BLE_ADAPTER: ${BLE_ADAPTER:-/org/bluez/hci0}
      BLE_POLL_INTERVAL: ${BLE_POLL_INTERVAL:-2s}
      BLE_SENSORS_FILE: /etc/home-metrics/sensors.json
    volumes:
      - /var/run/dbus:/var/run/dbus
      - ${SENSORS_FILE:-./examples/sensors.json.example}:/etc/home-metrics/sensors.json:ro
    cap_add:
      - NET_ADMIN
      - NET_RAW
    command: ["hm-ble-collector"]

volumes:
  pgdata:
