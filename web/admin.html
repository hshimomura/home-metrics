<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home Metrics Admin</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #f6f7f8; color: #202124; }
    main { max-width: 1240px; margin: 0 auto; padding: 24px; }
    header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
    h1 { font-size: 24px; margin: 0; }
    h2 { font-size: 17px; margin: 0 0 12px; }
    section { margin: 20px 0; }
    a { color: #0b57d0; }
    table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #d9dee3; }
    th, td { padding: 9px 10px; border-bottom: 1px solid #e4e7eb; text-align: left; font-size: 14px; vertical-align: top; }
    th { background: #eef1f4; font-weight: 650; white-space: nowrap; }
    tr:last-child td { border-bottom: 0; }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
    input { padding: 7px 8px; border: 1px solid #b8c0c8; border-radius: 6px; min-width: 240px; }
    button { padding: 8px 12px; border: 1px solid #7c8a97; border-radius: 6px; background: #fff; cursor: pointer; }
    button:hover { background: #eef1f4; }
    button:disabled { cursor: wait; opacity: 0.65; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
    .summary-item { border: 1px solid #d9dee3; background: #fff; padding: 12px; }
    .summary-label { color: #5f6b76; font-size: 12px; }
    .summary-value { font-size: 22px; font-weight: 700; margin-top: 4px; }
    .summary-value .summary-text,
    .summary-value .timestamp { display: block; font-size: 14px; line-height: 1.25; font-weight: 650; }
    .pill { display: inline-block; padding: 2px 7px; border-radius: 999px; font-size: 12px; border: 1px solid #c7ced6; }
    .ok { color: #146c2e; background: #e6f4ea; border-color: #9ad0a6; }
    .warning { color: #8a4b00; background: #fff4de; border-color: #e7bc6b; }
    .degraded, .failed { color: #a61b1b; background: #fce8e6; border-color: #e8a29a; }
    .disabled { color: #5f6b76; background: #f1f3f4; border-color: #c7ced6; }
    .muted { color: #5f6b76; font-size: 13px; }
    .error { color: #a61b1b; }
    .mono-wrap { overflow-wrap: anywhere; }
    @media (prefers-color-scheme: dark) {
      body { background: #151719; color: #e8eaed; }
      a { color: #8ab4f8; }
      table, .summary-item { background: #1f2327; border-color: #363c42; }
      th, td { border-bottom-color: #30363d; }
      th { background: #2a3036; }
      input, button { background: #1f2327; color: #e8eaed; border-color: #4b5560; }
      button:hover { background: #2a3036; }
      .summary-label, .muted { color: #a8b0b8; }
      .ok { color: #c8f2d0; background: #16351f; border-color: #2f6840; }
      .warning { color: #ffe0a3; background: #442c05; border-color: #76511b; }
      .degraded, .failed { color: #ffd1cc; background: #4b1c19; border-color: #7e322c; }
      .disabled { color: #a8b0b8; background: #2a3036; border-color: #4b5560; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Home Metrics Admin</h1>
        <div class="muted" id="status">Loading</div>
      </div>
      <div class="toolbar">
        <a href="/">Metrics</a>
        <input id="token" type="password" placeholder="API token">
        <button id="refresh">Refresh</button>
      </div>
    </header>

    <section>
      <h2>Collector Summary</h2>
      <div class="summary" id="summary"></div>
    </section>

    <section>
      <h2>Cisco Spaces Firehose</h2>
      <div class="summary" id="cisco-firehose"></div>
    </section>

    <section>
      <h2>Collector Status</h2>
      <table>
        <thead><tr><th>Collector</th><th>Target</th><th>Expected</th><th>Last Attempt</th><th>Last Success</th><th>Last Data</th><th>First Failure</th><th>Last Failure</th><th>Failures</th><th>Last Error</th></tr></thead>
        <tbody id="collectors"></tbody>
      </table>
    </section>

    <section>
      <h2>Schema</h2>
      <div class="summary" id="schema"></div>
    </section>
  </main>

  <script>
    const token = document.querySelector('#token');
    const statusLine = document.querySelector('#status');
    token.value = localStorage.getItem('ble_api_token') || '';
    token.addEventListener('change', () => localStorage.setItem('ble_api_token', token.value));
    document.querySelector('#refresh').addEventListener('click', load);

    function headers() {
      return token.value ? { Authorization: `Bearer ${token.value}` } : {};
    }

    async function getJSON(path) {
      const res = await fetch(path, { headers: headers() });
      if (!res.ok) throw new Error(`${path}: ${res.status}`);
      return res.json();
    }

    function escapeHTML(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[char]));
    }

    function cell(value) {
      return value === null || value === undefined || value === '' ? '-' : value;
    }

    function time(value) {
      return value ? new Date(value).toLocaleString() : '-';
    }

    function age(value) {
      if (!value) return '-';
      const seconds = Math.max(0, Math.floor((Date.now() - new Date(value).getTime()) / 1000));
      if (seconds < 90) return `${seconds}s ago`;
      const minutes = Math.floor(seconds / 60);
      if (minutes < 90) return `${minutes}m ago`;
      const hours = Math.floor(minutes / 60);
      if (hours < 48) return `${hours}h ago`;
      return `${Math.floor(hours / 24)}d ago`;
    }

    function timeBlock(value) {
      return value ? `<span class="timestamp">${escapeHTML(time(value))}</span><div class="muted">${age(value)}</div>` : '-';
    }

    function summaryText(value) {
      return `<span class="summary-text">${value}</span>`;
    }

    function pill(value) {
      return `<span class="pill ${escapeHTML(value)}">${escapeHTML(value)}</span>`;
    }

    function renderSummary(summary) {
      const items = [
        ['Status', pill(summary.status)],
        ['Database', pill(summary.database)],
        ['Collectors', escapeHTML(summary.collector_targets ?? 0)],
        ['Stale collectors', escapeHTML(summary.stale_collectors ?? 0)],
      ];
      document.querySelector('#summary').innerHTML = items.map(([label, value]) => (
        `<div class="summary-item"><div class="summary-label">${escapeHTML(label)}</div><div class="summary-value">${value}</div></div>`
      )).join('');
    }

    function renderCiscoFirehose(item) {
      const collectorEnabled = item.collector_enabled === true;
      const lock = !collectorEnabled ? pill('disabled') : (item.lock_held ? pill('ok') : pill(item.collector_status_present || item.configured_secondary_allowed ? 'warning' : 'disabled'));
      const reporting = !collectorEnabled ? pill('disabled') : (item.collector_reporting ? pill('ok') : pill(item.collector_status_present ? 'warning' : 'disabled'));
      const secondary = !collectorEnabled ? pill('disabled') : (item.configured_secondary_allowed ? pill('warning') : pill('ok'));
      const items = [
        ['Mode', `<code>${escapeHTML(item.mode)}</code>`],
        ['Expected', `${collectorEnabled ? pill('ok') : pill('disabled')}<div class="muted">CISCO_SPACES_COLLECTOR_ENABLED</div>`],
        ['Advisory lock', `${lock}<div class="muted">key ${escapeHTML(item.lock_key)}${item.lock_holder_pid ? ` / pid ${escapeHTML(item.lock_holder_pid)}` : ''}</div>`],
        ['Collector reporting', `${reporting}<div class="muted">${time(item.collector_updated_at)} / ${age(item.collector_updated_at)}</div>`],
        ['Secondary allowed', `${secondary}<div class="muted">API server config</div>`],
        ['Last data', timeBlock(item.last_data_at)],
        ['Failures', escapeHTML(item.consecutive_failures ?? 0)],
        ['Last error', `<span class="mono-wrap">${escapeHTML(cell(item.last_error))}</span>`],
      ];
      document.querySelector('#cisco-firehose').innerHTML = items.map(([label, value]) => (
        `<div class="summary-item"><div class="summary-label">${escapeHTML(label)}</div><div class="summary-value">${value}</div></div>`
      )).join('');
    }

    function renderSchema(schema) {
      const latest = schema.migrations?.length ? schema.migrations[schema.migrations.length - 1] : null;
      const items = [
        ['Current version', escapeHTML(schema.current_version ?? 0)],
        ['Applied migrations', escapeHTML(schema.migrations?.length ?? 0)],
        ['Latest migration', latest ? summaryText(`<code>${escapeHTML(latest.version)} ${escapeHTML(latest.name)}</code>`) : '-'],
        ['Latest applied', latest ? timeBlock(latest.applied_at) : '-'],
      ];
      document.querySelector('#schema').innerHTML = items.map(([label, value]) => (
        `<div class="summary-item"><div class="summary-label">${escapeHTML(label)}</div><div class="summary-value">${value}</div></div>`
      )).join('');
    }

    function renderCollectors(items) {
      document.querySelector('#collectors').innerHTML = items.map(item => `
        <tr>
          <td><code>${escapeHTML(item.collector_name)}</code></td>
          <td class="mono-wrap"><code>${escapeHTML(item.target_type)} / ${escapeHTML(item.target_key)}</code></td>
          <td>${item.expected ? pill('ok') : pill('disabled')}</td>
          <td>${time(item.last_attempt_at)}<div class="muted">${age(item.last_attempt_at)}</div></td>
          <td>${time(item.last_success_at)}<div class="muted">${age(item.last_success_at)}</div></td>
          <td>${time(item.last_data_at)}<div class="muted">${age(item.last_data_at)}</div></td>
          <td>${time(item.first_failure_at)}<div class="muted">${age(item.first_failure_at)}</div></td>
          <td>${time(item.last_failure_at)}<div class="muted">${age(item.last_failure_at)}</div></td>
          <td>${item.consecutive_failures}</td>
          <td class="mono-wrap">${escapeHTML(cell(item.last_error))}</td>
        </tr>
      `).join('') || '<tr><td colspan="10" class="muted">No collector status rows.</td></tr>';
    }

    async function load() {
      statusLine.textContent = 'Loading';
      statusLine.className = 'muted';
      try {
        const [summary, cisco, schema, collectors] = await Promise.all([
          getJSON('/api/health/details'),
          getJSON('/api/admin/cisco-spaces-firehose'),
          getJSON('/api/admin/schema'),
          getJSON('/api/admin/collector-status'),
        ]);
        renderSummary(summary);
        renderCiscoFirehose(cisco);
        renderSchema(schema);
        renderCollectors(collectors);
        statusLine.textContent = `Loaded ${new Date().toLocaleString()}`;
      } catch (err) {
        statusLine.textContent = err.message;
        statusLine.className = 'muted error';
      }
    }

    load();
  </script>
</body>
</html>
