        user_id:
          type: integer
        apns_device_token:
          type: string
        app_bundle_id:
          type: string
        apns_environment:
          $ref: '#/components/schemas/APNSEnvironment'
        device_name:
          type: string
        enabled:
          type: boolean
        disabled_reason:
          type: string
        disabled_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
