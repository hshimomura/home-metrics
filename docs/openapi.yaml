          type: integer
        user_id:
          type: integer
        mac:
          type: string
        metric:
          $ref: '#/components/schemas/SensorMetric'
        value:
          type: number
        threshold:
          type: number
        triggered_at:
          type: string
          format: date-time
        sent_at:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/NotificationStatus'
        error_message:
          type: string
        created_at:
          type: string
          format: date-time
    SchemaMigration:
      type: object
      required: [version, name, checksum, applied_at]
      properties:
        version:
          type: integer
          format: int64
        name:
          type: string
        checksum:
          type: string
        applied_at:
          type: string
          format: date-time
    SchemaStatus:
      type: object
      required: [current_version, migrations]
      properties:
        current_version:
          type: integer
          format: int64
        migrations:
          type: array
          items:
            $ref: '#/components/schemas/SchemaMigration'
    SensorSeries:
      type: object
      required: [mac, metric, range, points]
      properties:
        mac:
          type: string
        metric:
          $ref: '#/components/schemas/SensorMetric'
        range:
          $ref: '#/components/schemas/Range'
        unit:
          type: string
        points:
          type: array
          items:
            $ref: '#/components/schemas/SeriesPoint'
    SeriesPoint:
      type: object
      required: [ts, value]
      properties:
        ts:
          type: string
          format: date-time
        value:
          type: number
    TestNotificationResponse:
      type: object
      required: [id, app_bundle_id, apns_environment, status, sent_at]
      properties:
        id:
          type: integer
        device_name:
          type: string
        app_bundle_id:
          type: string
        apns_environment:
          $ref: '#/components/schemas/APNSEnvironment'
        notification_event_id:
          type: integer
        notification_event_created_at:
          type: string
          format: date-time
        status:
          type: string
        sent_at:
          type: string
          format: date-time
    TestHealthWebhookResponse:
      type: object
      required: [event_id, status]
      properties:
        event_id:
          type: string
        status:
          type: string
        http_status:
          type: integer
    APNSEnvironment:
      type: string
      enum: [sandbox, production]
    NotificationStatus:
      type: string
      enum: [pending, dry_run, sent, failed, skipped]
    Range:
      type: string
      enum: [1d, 1w, 1m, 3m, 1y]
      default: 1d
    SensorMetric:
      type: string
      enum:
        - temperature_c
        - humidity_percent
        - battery_percent
        - rssi_dbm
        - pressure_hpa
        - co2_ppm
        - lux
        - etvoc
