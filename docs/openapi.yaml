openapi: 3.1.0
info:
  title: Home Metrics API
  version: 1.0.0
  description: REST API served by hm-api-server for sensor, energy, alert, and iOS device data.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /
security:
  - bearerAuth: []
  - apiTokenHeader: []
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Check API and database health
      security: []
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          $ref: '#/components/responses/Error'
        '4XX':
          $ref: '#/components/responses/Error'
  /api/devices:
    get:
      operationId: listDevices
      summary: List BLE sensor devices
      responses:
        '200':
          description: Device list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Device'
        '401':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /api/devices/{mac}/latest:
    get:
      operationId: getDeviceLatest
      summary: Get latest BLE sensor values
      parameters:
        - $ref: '#/components/parameters/MacPath'
      responses:
        '200':
          description: Latest sensor values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LatestTelemetry'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /api/devices/{mac}/series:
    get:
      operationId: getDeviceSeries
      summary: Get BLE sensor time series
      parameters:
        - $ref: '#/components/parameters/MacPath'
        - name: metric
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/SensorMetric'
        - $ref: '#/components/parameters/RangeQuery'
      responses:
        '200':
          description: Sensor time series
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SensorSeries'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /api/energy/latest:
    get:
      operationId: getEnergyLatest
      summary: Get latest energy and UPS readings
      parameters:
        - name: source
          in: query
          required: false
          schema:
            type: string
        - name: device_key
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Latest energy readings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EnergyReading'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /api/energy/series:
    get:
      operationId: getEnergySeries
      summary: Get energy and UPS time series
      parameters:
        - name: source
          in: query
          required: true
          schema:
            type: string
        - name: device_key
          in: query
          required: true
          schema:
            type: string
        - name: metric
          in: query
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/RangeQuery'
      responses:
        '200':
          description: Energy time series
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnergySeries'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /api/alert-rules:
    get:
      operationId: listAlertRules
      summary: List alert rules
      responses:
        '200':
          description: Alert rule list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlertRule'
        '401':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
    post:
      operationId: createAlertRule
      summary: Create an alert rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertRuleRequest'
      responses:
        '201':
          description: Created alert rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRule'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /api/alert-rules/{id}:
    put:
      operationId: updateAlertRule
      summary: Replace an alert rule
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertRuleRequest'
      responses:
        '200':
          description: Updated alert rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRule'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteAlertRule
      summary: Delete an alert rule
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /api/alert-rules/{id}/reset-cooldown:
    post:
      operationId: resetAlertRuleCooldown
      summary: Reset an alert rule cooldown state
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Reset
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /api/notification-events:
    get:
      operationId: listNotificationEvents
      summary: List notification events
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/NotificationStatus'
        - name: mac
          in: query
          required: false
          schema:
            type: string
        - name: alert_rule_id
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Notification events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationEvent'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteNotificationEvents
      summary: Delete all notification events for the current user
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /api/ios/devices:
    get:
      operationId: listIOSDevices
      summary: List registered iOS devices
      responses:
        '200':
          description: iOS device list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IOSDevice'
        '401':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
    post:
      operationId: registerIOSDevice
      summary: Register or update an iOS device token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IOSDeviceRequest'
      responses:
        '201':
          description: Registered iOS device
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IOSDevice'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /api/ios/devices/{id}:
    put:
      operationId: updateIOSDevice
      summary: Replace an iOS device registration
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IOSDeviceRequest'
      responses:
        '200':
          description: Updated iOS device
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IOSDevice'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteIOSDevice
      summary: Delete an iOS device registration
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /api/ios/devices/{id}/test-notification:
    post:
      operationId: testIOSDeviceNotification
      summary: Send an APNs test notification to an iOS device
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Test notification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestNotificationResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    apiTokenHeader:
      type: apiKey
      in: header
      name: X-API-Token
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
    MacPath:
      name: mac
      in: path
      required: true
      schema:
        type: string
    RangeQuery:
      name: range
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Range'
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    AlertOperator:
      type: string
      enum: ['>', '>=', '<', '<=']
    AlertRule:
      type: object
      required: [id, mac, metric, operator, threshold, cooldown_seconds, enabled]
      properties:
        id:
          type: integer
        user_id:
          type: integer
        mac:
          type: string
        metric:
          $ref: '#/components/schemas/SensorMetric'
        operator:
          $ref: '#/components/schemas/AlertOperator'
        threshold:
          type: number
        cooldown_seconds:
          type: integer
          default: 86400
        enabled:
          type: boolean
          default: true
        last_notified_at:
          type: string
          format: date-time
        last_value:
          type: number
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AlertRuleRequest:
      type: object
      required: [mac, metric, operator, threshold]
      properties:
        mac:
          type: string
        metric:
          $ref: '#/components/schemas/SensorMetric'
        operator:
          $ref: '#/components/schemas/AlertOperator'
        threshold:
          type: number
        cooldown_seconds:
          type: integer
          minimum: 0
          default: 86400
        enabled:
          type: boolean
          default: true
    Device:
      type: object
      required: [mac, label, enabled]
      properties:
        mac:
          type: string
        label:
          type: string
        device_type:
          type: string
        location:
          type: string
        enabled:
          type: boolean
    EnergyReading:
      type: object
      required: [ts, source, device_key, metric, value, unit]
      properties:
        ts:
          type: string
          format: date-time
        source:
          type: string
        device_key:
          type: string
        label:
          type: string
        location:
          type: string
        metric:
          type: string
        value:
          type: number
        unit:
          type: string
    EnergySeries:
      type: object
      required: [source, device_key, metric, range, unit, points]
      properties:
        source:
          type: string
        device_key:
          type: string
        metric:
          type: string
        range:
          $ref: '#/components/schemas/Range'
        unit:
          type: string
        points:
          type: array
          items:
            $ref: '#/components/schemas/SeriesPoint'
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
        environment:
          type: string
        env:
          type: string
          deprecated: true
    IOSDevice:
      type: object
      required: [id, apns_device_token, app_bundle_id, apns_environment, enabled]
      properties:
        id:
          type: integer
        user_id:
          type: integer
        apns_device_token:
          type: string
        app_bundle_id:
          type: string
        apns_environment:
          $ref: '#/components/schemas/APNSEnvironment'
        device_name:
          type: string
        enabled:
          type: boolean
        disabled_reason:
          type: string
        disabled_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    IOSDeviceRequest:
      type: object
      required: [apns_device_token, app_bundle_id, apns_environment]
      properties:
        apns_device_token:
          type: string
        app_bundle_id:
          type: string
        apns_environment:
          $ref: '#/components/schemas/APNSEnvironment'
        device_name:
          type: [string, 'null']
        enabled:
          type: boolean
          default: true
    LatestTelemetry:
      type: object
      required: [device, ts, values]
      properties:
        device:
          $ref: '#/components/schemas/Device'
        ts:
          type: string
          format: date-time
        values:
          type: object
          additionalProperties:
            type: [number, 'null']
    NotificationEvent:
      type: object
      required: [id, triggered_at, status]
      properties:
        id:
          type: integer
        alert_rule_id:
          type: integer
        user_id:
          type: integer
        mac:
          type: string
        metric:
          $ref: '#/components/schemas/SensorMetric'
        value:
          type: number
        threshold:
          type: number
        triggered_at:
          type: string
          format: date-time
        sent_at:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/NotificationStatus'
        error_message:
          type: string
        created_at:
          type: string
          format: date-time
    SensorSeries:
      type: object
      required: [mac, metric, range, points]
      properties:
        mac:
          type: string
        metric:
          $ref: '#/components/schemas/SensorMetric'
        range:
          $ref: '#/components/schemas/Range'
        unit:
          type: string
        points:
          type: array
          items:
            $ref: '#/components/schemas/SeriesPoint'
    SeriesPoint:
      type: object
      required: [ts, value]
      properties:
        ts:
          type: string
          format: date-time
        value:
          type: number
    TestNotificationResponse:
      type: object
      required: [id, app_bundle_id, apns_environment, status, sent_at]
      properties:
        id:
          type: integer
        device_name:
          type: string
        app_bundle_id:
          type: string
        apns_environment:
          $ref: '#/components/schemas/APNSEnvironment'
        notification_event_id:
          type: integer
        notification_event_created_at:
          type: string
          format: date-time
        status:
          type: string
        sent_at:
          type: string
          format: date-time
    APNSEnvironment:
      type: string
      enum: [sandbox, production]
    NotificationStatus:
      type: string
      enum: [pending, dry_run, sent, failed, skipped]
    Range:
      type: string
      enum: [1d, 1w, 1m, 3m, 1y]
      default: 1d
    SensorMetric:
      type: string
      enum:
        - temperature_c
        - humidity_percent
        - battery_percent
        - rssi_dbm
        - pressure_hpa
        - co2_ppm
        - lux
        - etvoc
