          type: string
        app_bundle_id:
          type: string
        apns_environment:
          $ref: '#/components/schemas/APNSEnvironment'
        device_name:
          type: [string, 'null']
        enabled:
          type: boolean
          default: true
    LatestTelemetry:
      type: object
      required: [device, ts, values]
      properties:
        device:
          $ref: '#/components/schemas/Device'
        ts:
          type: string
          format: date-time
        values:
          type: object
          additionalProperties:
            type: [number, 'null']
    NotificationEvent:
      type: object
