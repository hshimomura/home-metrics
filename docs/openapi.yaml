openapi: 3.1.0
info:
  title: Home Metrics API
  version: 1.0.0
  description: REST API served by hm-api-server for sensor, energy, alert, and iOS device data.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /
security:
  - bearerAuth: []
  - apiTokenHeader: []
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Check API and database health
      security: []
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          $ref: '#/components/responses/Error'
        '4XX':
          $ref: '#/components/responses/Error'
  /api/devices:
    get:
      operationId: listDevices
      summary: List BLE sensor devices
      responses:
        '200':
          description: Device list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Device'
        '401':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /api/devices/{mac}/latest:
    get:
      operationId: getDeviceLatest
      summary: Get latest BLE sensor values
      parameters:
        - $ref: '#/components/parameters/MacPath'
      responses:
        '200':
          description: Latest sensor values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LatestTelemetry'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /api/devices/{mac}/series:
    get:
      operationId: getDeviceSeries
      summary: Get BLE sensor time series
      parameters:
        - $ref: '#/components/parameters/MacPath'
        - name: metric
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/SensorMetric'
        - $ref: '#/components/parameters/RangeQuery'
      responses:
        '200':
          description: Sensor time series
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SensorSeries'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /api/energy/latest:
    get:
      operationId: getEnergyLatest
      summary: Get latest energy and UPS readings
      parameters:
        - name: source
          in: query
          required: false
          schema:
            type: string
        - name: device_key
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Latest energy readings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EnergyReading'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /api/energy/series:
    get:
      operationId: getEnergySeries
      summary: Get energy and UPS time series
      parameters:
        - name: source
          in: query
          required: true
          schema:
            type: string
        - name: device_key
          in: query
          required: true
          schema:
            type: string
        - name: metric
          in: query
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/RangeQuery'
      responses:
        '200':
          description: Energy time series
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnergySeries'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /api/alert-rules:
    get:
      operationId: listAlertRules
      summary: List alert rules
      responses:
        '200':
          description: Alert rule list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlertRule'
        '401':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
    post:
      operationId: createAlertRule
      summary: Create an alert rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertRuleRequest'
      responses:
        '201':
          description: Created alert rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRule'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /api/alert-rules/{id}:
    put:
      operationId: updateAlertRule
      summary: Replace an alert rule
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertRuleRequest'
      responses:
        '200':
          description: Updated alert rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRule'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteAlertRule
      summary: Delete an alert rule
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /api/alert-rules/{id}/reset-cooldown:
    post:
      operationId: resetAlertRuleCooldown
      summary: Reset an alert rule cooldown state
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Reset
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /api/notification-events:
    get:
      operationId: listNotificationEvents
      summary: List notification events
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/NotificationStatus'
        - name: mac
          in: query
          required: false
          schema:
            type: string
        - name: alert_rule_id
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Notification events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationEvent'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteNotificationEvents
      summary: Delete all notification events for the current user
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /api/health/details:
    get:
      operationId: getHealthDetails
      summary: Get backend health summary
      responses:
        '200':
          description: Backend health summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthDetails'
        '401':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/admin/schema:
    get:
      operationId: getAdminSchema
      summary: Get applied database schema migrations
      responses:
        '200':
          description: Schema migration status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaStatus'
        '401':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /api/admin/cisco-spaces-firehose:
    get:
      operationId: getCiscoSpacesFirehoseStatus
      summary: Get Cisco Spaces Firehose advisory lock status
      responses:
        '200':
          description: Cisco Spaces Firehose status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CiscoSpacesFirehoseStatus'
        '401':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /api/admin/collector-status:
    get:
      operationId: listCollectorStatus
      summary: List collector self-reported status rows
      responses:
        '200':
          description: Collector status list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CollectorStatus'
        '401':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /api/admin/health-alerts:
    get:
      operationId: listHealthAlerts
      summary: List backend health alerts
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [firing, resolved]
      responses:
        '200':
          description: Health alert list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HealthAlert'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /api/admin/maintenance:
    get:
      operationId: listMaintenanceTargets
      summary: List active health maintenance targets
      responses:
        '200':
          description: Active maintenance targets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MaintenanceTarget'
        '401':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
    post:
      operationId: startMaintenance
      summary: Start maintenance mode for a health alert target
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceRequest'
      responses:
        '200':
          description: Maintenance target
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceTarget'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /api/admin/maintenance/{alert_key}:
    delete:
      operationId: endMaintenance
      summary: End maintenance mode for a health alert target
      parameters:
        - $ref: '#/components/parameters/AlertKeyPath'
      responses:
        '200':
          description: Ended maintenance target
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceTarget'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /api/admin/devices/{mac}/maintenance:
    post:
      operationId: setDeviceMaintenance
      summary: Set or clear device maintenance mode for health monitoring
      parameters:
        - $ref: '#/components/parameters/MacPath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HealthAlertOperationRequest'
      responses:
        '200':
          description: Updated device
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /api/admin/health-alerts/{alert_key}/test-webhook:
    post:
      operationId: testHealthAlertWebhook
      summary: Send a test admin webhook for a backend health alert
      parameters:
        - $ref: '#/components/parameters/AlertKeyPath'
      responses:
        '200':
          description: Test webhook result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestHealthWebhookResponse'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/admin/health-notification-events:
    get:
      operationId: listHealthNotificationEvents
      summary: List backend health webhook delivery events
      responses:
        '200':
          description: Health notification event list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HealthNotificationEvent'
        '401':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteHealthNotificationEvents
      summary: Clear backend health webhook delivery history
      description: Deletes health_notification_events only. It does not delete health_alert_state or user notification_events.
      responses:
        '204':
          description: Webhook delivery history cleared
        '401':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /api/ios/devices:
    get:
      operationId: listIOSDevices
      summary: List registered iOS devices
      responses:
        '200':
          description: iOS device list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IOSDevice'
        '401':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
    post:
      operationId: registerIOSDevice
      summary: Register or update an iOS device token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IOSDeviceRequest'
      responses:
        '201':
          description: Registered iOS device
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IOSDevice'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /api/ios/devices/{id}:
    put:
      operationId: updateIOSDevice
      summary: Replace an iOS device registration
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IOSDeviceRequest'
      responses:
        '200':
          description: Updated iOS device
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IOSDevice'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteIOSDevice
      summary: Delete an iOS device registration
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /api/ios/devices/{id}/test-notification:
    post:
      operationId: testIOSDeviceNotification
      summary: Send an APNs test notification to an iOS device
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Test notification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestNotificationResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    apiTokenHeader:
      type: apiKey
      in: header
      name: X-API-Token
  parameters:
    AlertKeyPath:
      name: alert_key
      in: path
      required: true
      schema:
        type: string
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
    MacPath:
      name: mac
      in: path
      required: true
      schema:
        type: string
    RangeQuery:
      name: range
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Range'
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    CiscoSpacesFirehoseStatus:
      type: object
      required: [lock_key, lock_held, mode, configured_secondary_allowed, collector_status_present, collector_reporting, consecutive_failures]
      properties:
        lock_key:
          type: integer
          format: int64
        lock_held:
          type: boolean
        lock_holder_pid:
          type: integer
        mode:
          type: string
        configured_secondary_allowed:
          type: boolean
          description: API server view of CISCO_SPACES_ALLOW_SECONDARY.
        collector_status_present:
          type: boolean
        collector_reporting:
          type: boolean
        collector_updated_at:
          type: string
          format: date-time
        last_attempt_at:
          type: string
          format: date-time
        last_success_at:
          type: string
          format: date-time
        last_data_at:
          type: string
          format: date-time
        first_failure_at:
          type: string
          format: date-time
        last_failure_at:
          type: string
          format: date-time
        consecutive_failures:
          type: integer
        last_error:
          type: string
    CollectorStatus:
      type: object
      required: [collector_name, target_type, target_key, consecutive_failures, updated_at]
      properties:
        collector_name:
          type: string
        target_type:
          type: string
        target_key:
          type: string
        last_attempt_at:
          type: string
          format: date-time
        last_success_at:
          type: string
          format: date-time
        last_data_at:
          type: string
          format: date-time
        first_failure_at:
          type: string
          format: date-time
        last_failure_at:
          type: string
          format: date-time
        last_error:
          type: string
        consecutive_failures:
          type: integer
        updated_at:
          type: string
          format: date-time
    AlertOperator:
      type: string
      enum: ['>', '>=', '<', '<=']
    AlertRule:
      type: object
      required: [id, mac, metric, operator, threshold, cooldown_seconds, enabled]
      properties:
        id:
          type: integer
        user_id:
          type: integer
        mac:
          type: string
        metric:
          $ref: '#/components/schemas/SensorMetric'
        operator:
          $ref: '#/components/schemas/AlertOperator'
        threshold:
          type: number
        cooldown_seconds:
          type: integer
          default: 86400
        enabled:
          type: boolean
          default: true
        last_notified_at:
          type: string
          format: date-time
        last_value:
          type: number
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AlertRuleRequest:
      type: object
      required: [mac, metric, operator, threshold]
      properties:
        mac:
          type: string
        metric:
          $ref: '#/components/schemas/SensorMetric'
        operator:
          $ref: '#/components/schemas/AlertOperator'
        threshold:
          type: number
        cooldown_seconds:
          type: integer
          minimum: 0
          default: 86400
        enabled:
          type: boolean
          default: true
    Device:
      type: object
      required: [mac, label, enabled, maintenance_mode]
      properties:
        mac:
          type: string
        label:
          type: string
        sensor_category:
          type: string
        location:
          type: string
        enabled:
          type: boolean
        maintenance_mode:
          type: boolean
        maintenance_reason:
          type: string
        maintenance_since:
          type: string
          format: date-time
    EnergyReading:
      type: object
      required: [ts, source, device_key, metric, value, unit]
      properties:
        ts:
          type: string
          format: date-time
        source:
          type: string
        device_key:
          type: string
        label:
          type: string
        location:
          type: string
        metric:
          type: string
        value:
          type: number
        unit:
          type: string
    EnergySeries:
      type: object
      required: [source, device_key, metric, range, unit, points]
      properties:
        source:
          type: string
        device_key:
          type: string
        metric:
          type: string
        range:
          $ref: '#/components/schemas/Range'
        unit:
          type: string
        points:
          type: array
          items:
            $ref: '#/components/schemas/SeriesPoint'
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    HealthAlert:
      type: object
      required: [alert_key, status, severity, title, source, summary, labels, last_evaluated_at, updated_at]
      properties:
        alert_key:
          type: string
        status:
          type: string
          enum: [firing, resolved]
        severity:
          type: string
          enum: [info, warning, critical]
        title:
          type: string
        source:
          type: string
        summary:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
        first_fired_at:
          type: string
          format: date-time
        last_evaluated_at:
          type: string
          format: date-time
        last_notified_at:
          type: string
          format: date-time
        acknowledged_at:
          type: string
          format: date-time
        acknowledged_by:
          type: string
        muted_until:
          type: string
          format: date-time
        muted_by:
          type: string
        muted_reason:
          type: string
        manually_resolved_at:
          type: string
          format: date-time
        manually_resolved_by:
          type: string
        resolved_at:
          type: string
          format: date-time
        maintenance:
          $ref: '#/components/schemas/MaintenanceTarget'
        updated_at:
          type: string
          format: date-time
    MaintenanceTarget:
      type: object
      required: [alert_key, target_kind, target_label, started_at, updated_at]
      properties:
        alert_key:
          type: string
        target_kind:
          type: string
        target_label:
          type: string
        reason:
          type: string
        started_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        created_by:
          type: string
        updated_at:
          type: string
          format: date-time
    MaintenanceRequest:
      type: object
      required: [alert_key]
      properties:
        alert_key:
          type: string
        target_kind:
          type: string
        target_label:
          type: string
        duration:
          type: string
          description: Empty for indefinite maintenance, or a Go duration such as 1h or 24h.
        reason:
          type: string
        actor:
          type: string
    HealthAlertOperationRequest:
      type: object
      properties:
        actor:
          type: string
        duration:
          type: string
          example: 1h
        reason:
          type: string
        maintenance_mode:
          type: boolean
    HealthDetails:
      type: object
      required: [status, database, collector_targets, stale_collectors, active_health_alerts, failed_deliveries_24h, webhook_configured]
      properties:
