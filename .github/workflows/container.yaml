name: Container

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/home-metrics
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd
      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.description=Home sensor, energy, UPS, Cisco Spaces, and Cisco IoT Orchestrator metrics collector with TimescaleDB, API, and web UI.
          annotations: |
            org.opencontainers.image.description=Home sensor, energy, UPS, Cisco Spaces, and Cisco IoT Orchestrator metrics collector with TimescaleDB, API, and web UI.
      - id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Summarize image digest
        run: |
          {
            echo "## Published image"
            echo
            echo "- Image: \`${IMAGE_NAME}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo
            echo "Use this digest from servicecore:"
            echo
            echo "\`\`\`text"
            echo "${IMAGE_NAME}@${{ steps.build.outputs.digest }}"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
