name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      timescaledb:
        image: timescale/timescaledb:latest-pg17
        env:
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      HM_TEST_DATABASE_URL: postgres://postgres:ci-test-only@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: 1.26.11
          cache: true
      - run: test -z "$(gofmt -l cmd internal tools)"
      - run: ./tools/generate-schema.sh && git diff --exit-code -- db/schema.sql
      - run: go vet ./...
      - run: go test -race ./...
      - run: go test ./cmd/hm-cisco-iot-orchestrator-collector -run '^$' -fuzz '^FuzzBLEDecoders$' -fuzztime=5s -parallel=2
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: make build

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - run: npx --yes @redocly/cli@1.34.5 lint docs/openapi.yaml
